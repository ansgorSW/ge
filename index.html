<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assassin’s Creed Mirage – Historisch richtig?</title>
<style>
  :root{--bg:#10142a;--panel:#171c38;--line:#2a3158;--ink:#e9e6da;--mute:#8d93b8;--brass:#d6a84f;--lapis:#3b5bdb;--bad:#e5484d;--ok:#3fb27f}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
  [hidden]{display:none!important}

  #home{min-height:100%;display:grid;place-items:center;padding:2rem;text-align:center;
    background:radial-gradient(circle at 50% 40%,#1a2050 0,var(--bg) 65%)}
  #home h1{font-weight:400;font-size:clamp(1.8rem,5vw,3.4rem);line-height:1.2;margin:0;cursor:default;user-select:none}
  #home h1 span{display:block;font-size:.5em;color:var(--brass);margin-top:.8rem;font-style:italic}

  #gate{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,12,28,.85)}
  #gate form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;width:min(320px,90vw);font:14px system-ui,sans-serif}
  #gate input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--ink);font:inherit;margin-bottom:12px}
  #gate input.bad{border-color:var(--bad)}

  #team{height:100%;display:flex;flex-direction:column;font:14px/1.45 system-ui,sans-serif}
  .bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .bar b{font:400 17px Georgia,serif;color:var(--brass)}
  .bar .sp{flex:1}
  button{font:inherit;color:inherit;background:var(--lapis);border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
  button:hover{filter:brightness(1.15)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--mute)}
  button.danger{background:var(--bad)}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  #app{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border-radius:0;color:var(--mute);padding:11px}
  .tabs button.on{color:var(--ink);box-shadow:inset 0 -2px var(--brass)}
  .side{flex:1;overflow:auto;padding:8px}
  .file{display:block;width:100%;text-align:left;background:none;border-radius:5px;padding:5px 8px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file:hover{background:#222a52}
  .file.on{background:#2a3470}
  .tools{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .head{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
  .head .name{flex:1;font-family:ui-monospace,Consolas,monospace;color:var(--brass);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #ed{flex:1;width:100%;resize:none;border:0;background:var(--bg);color:var(--ink);padding:14px;font:13px/1.55 ui-monospace,Consolas,monospace;tab-size:2;white-space:pre}
  #pv{flex:1;width:100%;border:0;background:#fff}
  .empty{margin:auto;color:var(--mute);text-align:center;padding:20px}
  .drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--mute);margin-bottom:14px;cursor:pointer}
  .drop.over{border-color:var(--brass);color:var(--ink)}
  video{width:100%;max-height:70vh;border-radius:6px;background:#000}
  #prog{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(420px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font:14px system-ui,sans-serif;z-index:5}
  #prog .pbar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}
  #prog i{display:block;height:100%;width:0;background:var(--brass);transition:width .15s}
  .tabs button{padding:11px 4px;font-size:13px}
  .row{flex:1;display:flex;min-height:0}
  .edcol{flex:1;display:flex;min-width:0}
  #gut{width:54px;overflow:hidden;padding:14px 8px 40px;text-align:right;white-space:pre;color:var(--mute);background:var(--panel);font:13px/1.55 ui-monospace,Consolas,monospace;user-select:none}
  #ed{overflow:auto}
  .fbar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
  .fbar input,.ai textarea,.ai input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--ink);font:inherit}
  .fbar input{flex:1;min-width:0}
  .ai{width:360px;max-width:45%;border-left:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
  .ai h3{margin:0;font:400 18px Georgia,serif;color:var(--brass)}
  .ai textarea{width:100%;resize:vertical}
  .ai input{width:70px}
  .rg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .dif{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;overflow:hidden;font:12px/1.4 ui-monospace,Consolas,monospace}
  .dif b{display:block;padding:4px 8px;background:var(--bg);font:600 12px system-ui}
  .dif pre{margin:0;padding:4px 8px;white-space:pre-wrap;word-break:break-all}
  .dif .o{background:#3a1d24;color:#ffb4b8} .dif .n{background:#17352a;color:#a6e8c8}
  .dash{padding:24px;overflow:auto}
  .dash h2{margin:0 0 16px;font:400 24px Georgia,serif;color:var(--brass)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card span{color:var(--mute);display:block} .card b{font:400 26px Georgia,serif}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  @media(max-width:900px){.ai{width:100%;max-width:none;border-left:0;border-top:1px solid var(--line)}.row{flex-direction:column}}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:8px;max-width:90vw;font:14px system-ui,sans-serif}
  #toast.err{border-color:var(--bad)} #toast.ok{border-color:var(--ok)}
  @media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:240px 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>

<section id="home">
  <h1 id="title">Assassin’s Creed Mirage<span>Historisch richtig?</span></h1>
</section>

<div id="gate" hidden>
  <form id="gateForm" autocomplete="off">
    <input type="password" id="pw" placeholder="Passwort" aria-label="Passwort">
    <button type="submit" style="width:100%">Öffnen</button>
  </form>
</div>

<section id="team" hidden>
  <div class="bar">
    <b>Team</b><span id="st" style="color:var(--mute)"></span><span class="sp"></span><button class="ghost" id="tokBtn">Schreibzugriff</button><button class="ghost" id="modeBtn">Lokal testen</button>
    <button class="ghost" id="leave">Schließen</button>
  </div>
  <div id="app">
    <aside>
      <div class="tabs">
        <button class="on" data-tab="home">Übersicht</button>
        <button data-tab="files">Dateien</button>
        <button data-tab="videos">Videos</button>
        <button data-tab="ai">KI</button>
      </div>
      <div class="side" id="side"></div>
      <div class="tools">
        <button id="newFile">Neue Datei</button>
        <button class="ghost" id="importBtn">Hochladen</button>
        <input type="file" id="importIn" multiple hidden>
      </div>
    </aside>
    <main id="main"><div class="empty">Wähle links eine Datei aus.</div></main>
  </div>
</section>

<div id="prog" hidden><div id="pn"></div><div class="pbar"><i id="pf"></i></div></div>
<div id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const VIDEO = /\.(mp4|webm|mov|m4v)$/i;
const TEXT = /\.(html?|css|js|json|md|txt|svg|xml|csv)$/i;
const PW_HASH = 'vbtwavfi0j';
let tab = 'home', cur = null, repo = '', branch = '', tree = [], videoUrl = null;
const TOKEN_ENC = 'U29JNmxNNDc2UUYzS1NaWHRHQVU2UmxJNG94N0tJblJOY0RMSnlwUVlqejZQeGF0eGFqMWQ1WUd5M2hfMkhQeVY0eGNxenRtMElWRFhTNUIxMV90YXBfYnVodGln';   // hier wird später der verschlüsselte Token eingefügt
const token = () => localStorage.getItem('ghtok') || (TOKEN_ENC ? atob(TOKEN_ENC).split('').reverse().join('') : '');

function hash(s){
  let a = 0xdeadbeef, b = 0x41c6ce57;
  for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36);
}

/* ---------- Geheimer Zugang ---------- */
let clicks = 0, timer;
$('#title').addEventListener('click', () => {
  clearTimeout(timer);
  if (++clicks >= 5){ clicks = 0; askPw(); return; }
  timer = setTimeout(() => clicks = 0, 2000);
});
function askPw(){
  if (sessionStorage.getItem('ok') === PW_HASH){ openTeam(); return; }
  $('#gate').hidden = false; $('#pw').value = ''; $('#pw').focus();
}
$('#gate').addEventListener('click', e => { if (e.target.id === 'gate') $('#gate').hidden = true; });
$('#gateForm').onsubmit = e => {
  e.preventDefault();
  if (hash($('#pw').value) === PW_HASH){ sessionStorage.setItem('ok', PW_HASH); $('#gate').hidden = true; openTeam(); }
  else { $('#pw').classList.add('bad'); $('#pw').value = ''; setTimeout(() => $('#pw').classList.remove('bad'), 800); }
};
function openTeam(){
  $('#home').hidden = true; $('#team').hidden = false;
  document.title = 'Team'; history.replaceState(null, '', '#team');
  load();
}
$('#leave').onclick = () => {
  sessionStorage.removeItem('ok');
  $('#team').hidden = true; $('#home').hidden = false;
  document.title = 'Assassin’s Creed Mirage – Historischer Realismus';
  history.replaceState(null, '', location.pathname); cur = null; setTab('home');
};

/* ---------- Speicher: GitHub (online) oder lokaler Ordner (zum Testen) ---------- */
const onPages = location.hostname.endsWith('.github.io');
let mode = onPages ? 'gh' : (localStorage.getItem('mode') || 'dir'), dir = null;
function toast(msg, type){
  const t = $('#toast'); t.textContent = msg; t.className = type || ''; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 4000);
}
function detect(){
  const h = location.hostname;
  if (onPages){ const o = h.split('.')[0]; return o + '/' + (location.pathname.split('/')[1] || h); }
  return localStorage.getItem('repo') || '';
}
async function api(path, opt = {}){
  const headers = { Accept: 'application/vnd.github+json', ...(opt.headers || {}) };
  if (token()) headers.Authorization = 'Bearer ' + token();
  const r = await fetch('https://api.github.com/repos/' + repo + path, { ...opt, headers });
  if (!r.ok){ let m = r.status; try { m = (await r.json()).message } catch(e){} throw new Error(m); }
  return r;
}
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const b64text = s => btoa(unescape(encodeURIComponent(s)));
const b64blob = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = no; r.readAsDataURL(b); });
function status(){
  $('#st').textContent = mode === 'gh' ? repo + (token() ? ' · Schreibzugriff' : ' · nur lesen') : 'Lokaler Ordner' + (dir ? ': ' + dir.name : ': nicht gewählt');
  $('#tokBtn').textContent = mode === 'gh' ? 'Schreibzugriff' : 'Ordner wählen';
  $('#modeBtn').textContent = mode === 'gh' ? 'Lokal testen' : 'GitHub';
  $('#modeBtn').hidden = onPages;
}
const canWrite = () => {
  if (mode === 'dir' ? dir : token()) return true;
  toast(mode === 'dir' ? 'Zuerst oben „Ordner wählen“ klicken.' : 'Dafür braucht dieses Gerät einmalig den Token (Schreibzugriff).', 'err');
  return false;
};

/* Lokaler Ordner */
async function walk(h, base, out){
  for await (const [name, e] of h.entries()){
    if (name.startsWith('.') || name === 'node_modules') continue;
    if (e.kind === 'directory') await walk(e, base + name + '/', out); else out.push({ path: base + name });
  }
}
async function dirFile(path, create){
  const parts = path.split('/'); let h = dir;
  for (const p of parts.slice(0, -1)) h = await h.getDirectoryHandle(p, { create });
  return h.getFileHandle(parts.pop(), { create });
}

/* Gemeinsame Funktionen für beide Modi */
async function readFile(f){
  if (mode === 'dir') return (await dirFile(f.path)).getFile();
  return (await api('/contents/' + enc(f.path) + '?ref=' + encodeURIComponent(branch), { headers: { Accept: 'application/vnd.github.raw+json' } })).blob();
}
function xhrPut(url, body, onp){
  return new Promise((ok, no) => {
    const x = new XMLHttpRequest(); x.open('PUT', url);
    x.setRequestHeader('Accept', 'application/vnd.github+json');
    if (token()) x.setRequestHeader('Authorization', 'Bearer ' + token());
    x.upload.onprogress = e => { if (e.lengthComputable && onp) onp(e.loaded / e.total); };
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch(e){} x.status < 300 ? ok(j) : no(new Error(j.message || x.status)); };
    x.onerror = () => no(new Error('Netzwerkfehler'));
    x.send(body);
  });
}
async function writeFile(path, data, sha, onp){
  if (mode === 'dir'){
    const w = await (await dirFile(path, true)).createWritable();
    if (typeof data === 'string') await w.write(data);
    else { const CH = 8 * 1024 * 1024; for (let i = 0; i < data.size; i += CH){ await w.write(data.slice(i, i + CH)); if (onp) onp(Math.min(1, (i + CH) / data.size)); } }
    await w.close(); return null;
  }
  const content = typeof data === 'string' ? b64text(data) : await b64blob(data);
  const j = await xhrPut('https://api.github.com/repos/' + repo + '/contents/' + enc(path), JSON.stringify({ message: 'Update ' + path, content, branch, ...(sha ? { sha } : {}) }), onp);
  return j.content.sha;
}
async function removeFile(f){
  if (mode === 'dir'){
    const parts = f.path.split('/'); let h = dir;
    for (const p of parts.slice(0, -1)) h = await h.getDirectoryHandle(p);
    return h.removeEntry(parts.pop());
  }
  await api('/contents/' + enc(f.path), { method: 'DELETE', body: JSON.stringify({ message: 'Delete ' + f.path, sha: f.sha, branch }) });
}
const savedMsg = () => mode === 'dir' ? 'Im Ordner gespeichert.' : 'Gespeichert. Online in ca. 1 Minute.';

async function load(){
  status();
  try {
    if (mode === 'dir'){
      tree = []; if (dir) await walk(dir, '', tree);
      loaded();
      if (!dir) toast('Klicke oben auf „Ordner wählen“ und wähle den Ordner mit der index.html.');
      return;
    }
    repo = detect();
    if (!repo){ repo = (prompt('GitHub-Repository (name/repo)') || '').trim(); if (!repo) return; localStorage.setItem('repo', repo); }
    status();
    branch = (await (await api('')).json()).default_branch;
    tree = (await (await api('/git/trees/' + encodeURIComponent(branch) + '?recursive=1')).json()).tree.filter(x => x.type === 'blob');
    loaded();
    if (!token()) toast('Zum Speichern einmalig auf „Schreibzugriff“ klicken.');
  } catch(err){ toast('Laden fehlgeschlagen: ' + err.message, 'err'); }
}
async function embedToken(t){
  const f = tree.find(x => x.path === 'index.html'); if (!f) return;
  try {
    let text = await (await readFile(f)).text();
    const re = /const TOKEN_ENC = '[^']*';/;
    if (!re.test(text)) return;
    const line = "const TOKEN_ENC = '" + btoa(t.split('').reverse().join('')) + "';";
    await writeFile('index.html', text.replace(re, () => line), f.sha);
    toast('Token ist fest eingebaut. In ca. 1 Minute gilt er auf allen Geräten.', 'ok'); await load();
  } catch(err){ toast('Einbauen fehlgeschlagen: ' + err.message, 'err'); }
}
$('#tokBtn').onclick = async () => {
  if (mode === 'dir'){
    if (!window.showDirectoryPicker){ toast('Dieser Browser kann keine Ordner öffnen. Nutze Chrome oder Edge.', 'err'); return; }
    try { dir = await showDirectoryPicker({ mode: 'readwrite' }); } catch(e){ return; }
  } else {
    const t = (prompt('GitHub-Token einfügen (leer lassen = Zugriff entfernen)') || '').trim();
    if (t){ localStorage.setItem('ghtok', t); await load(); await embedToken(t); return; }
    localStorage.removeItem('ghtok');
  }
  load();
};
$('#modeBtn').onclick = () => {
  mode = mode === 'gh' ? 'dir' : 'gh'; localStorage.setItem('mode', mode);
  cur = null; tree = []; setTab('home'); load();
};

/* ---------- Seitenleiste ---------- */
const tabBtns = document.querySelectorAll('.tabs button');
function setTab(t){
  tab = t; cur = null;
  tabBtns.forEach(x => x.classList.toggle('on', x.dataset.tab === t));
  renderSide();
  if (t === 'videos') showVideos(); else if (t === 'home') showHome();
  else $('#main').innerHTML = '<div class="empty">Wähle links eine Datei aus' + (t === 'ai' ? ', die die KI bearbeiten soll' : '') + '.</div>';
}
tabBtns.forEach(b => b.onclick = () => setTab(b.dataset.tab));
function loaded(){ renderSide(); if (tab === 'home' && !cur) showHome(); }
function renderSide(){
  const side = $('#side'); side.innerHTML = '';
  const list = tree.filter(f => tab === 'videos' ? VIDEO.test(f.path) : !VIDEO.test(f.path)).sort((a, b) => a.path.localeCompare(b.path));
  if (!list.length){ side.innerHTML = '<div class="empty">' + (tab === 'videos' ? 'Noch keine Videos.' : 'Keine Dateien.') + '</div>'; return; }
  list.forEach(f => {
    const b = document.createElement('button');
    b.className = 'file' + (cur && cur.path === f.path ? ' on' : '');
    b.textContent = f.path;
    b.onclick = () => tab === 'videos' ? playVideo(f) : openFile(f);
    side.appendChild(b);
  });
}
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name.split('/').pop(); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function showHome(){
  const vids = tree.filter(f => VIDEO.test(f.path)).length, fl = tree.length - vids;
  const size = tree.reduce((a, f) => a + (f.size || 0), 0);
  const cards = [['Dateien', fl], ['Videos', vids], ['Größe', size ? (size / 1048576).toFixed(1) + ' MB' : '–'], ['Modus', mode === 'gh' ? 'GitHub' : 'Lokal']];
  $('#main').innerHTML = '<div class="dash"><h2>Übersicht</h2><div class="cards">' +
    cards.map(c => '<div class="card"><span>' + c[0] + '</span><b>' + c[1] + '</b></div>').join('') +
    '</div><div class="acts"><button id="qn">Neue Datei</button><button class="ghost" id="qv">Video hochladen</button><button class="ghost" id="qa">KI öffnen</button></div></div>';
  $('#qn').onclick = () => $('#newFile').click(); $('#qv').onclick = () => setTab('videos'); $('#qa').onclick = () => setTab('ai');
}

/* ---------- Editor ---------- */
function gutter(){
  const ed = $('#ed'); if (!ed) return;
  $('#gut').textContent = Array.from({ length: ed.value.split('\n').length }, (_, i) => i + 1).join('\n');
  $('#gut').scrollTop = ed.scrollTop;
}
function mark(){ const ed = $('#ed'); if (ed && cur) $('.name').textContent = cur.path + (ed.value !== cur.text ? ' ●' : ''); }
async function openFile(f){
  if (!TEXT.test(f.path)){ toast('Diese Dateiart lässt sich hier nicht bearbeiten.', 'err'); return; }
  try { f.text = await (await readFile(f)).text(); } catch(err){ toast('Öffnen fehlgeschlagen: ' + err.message, 'err'); return; }
  if (tab === 'home' || tab === 'videos'){ tab = 'files'; tabBtns.forEach(x => x.classList.toggle('on', x.dataset.tab === 'files')); }
  cur = f; renderSide();
  const isHtml = /\.html?$/i.test(f.path);
  const ai = '<div class="ai"><h3>KI-Assistent</h3>' +
    '<div class="rg">Zeilen <input id="a1" type="number" min="1" placeholder="von"> – <input id="a2" type="number" min="1" placeholder="bis"><button class="ghost" id="asel">Markierung</button></div>' +
    '<textarea id="ap" rows="4" placeholder="Was soll die KI ändern? z. B. Mach den Titel größer und blau."></textarea>' +
    '<div class="rg"><button id="asend">Mit KI senden</button><button class="ghost" id="acopy">Prompt kopieren</button><button class="ghost" id="akey">API-Key</button></div>' +
    '<textarea id="ar" rows="4" placeholder="Oder: Antwort einer KI (JSON) hier einfügen …"></textarea>' +
    '<div class="rg"><button class="ghost" id="atr">Übersetzen &amp; Vorschau</button></div><div id="aout"></div></div>';
  $('#main').innerHTML =
    '<div class="head"><span class="name"></span><button class="ghost" id="fnd">Suchen</button>' + (isHtml ? '<button class="ghost" id="prev">Vorschau</button>' : '') +
    '<button class="ghost" id="dl">Herunterladen</button><button class="danger" id="del">Löschen</button><button id="save">Speichern</button></div>' +
    '<div class="fbar" id="fbar" hidden><input id="fi" placeholder="Suchen"><input id="ri" placeholder="Ersetzen durch"><button class="ghost" id="fa">Alle ersetzen</button><span id="fc" style="color:var(--mute)"></span></div>' +
    '<div class="row"><div class="edcol"><div id="gut"></div><textarea id="ed" spellcheck="false" wrap="off"></textarea></div>' + (tab === 'ai' ? ai : '') + '</div>';
  const ed = $('#ed'); ed.value = f.text; mark(); gutter();
  ed.addEventListener('input', () => { gutter(); mark(); });
  ed.addEventListener('scroll', () => { $('#gut').scrollTop = ed.scrollTop; });
  ed.addEventListener('keydown', e => {
    if (e.key === 'Tab'){ e.preventDefault(); ed.setRangeText('  ', ed.selectionStart, ed.selectionEnd, 'end'); gutter(); mark(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 's'){ e.preventDefault(); save(); }
  });
  $('#save').onclick = save;
  $('#del').onclick = () => remove(f);
  $('#dl').onclick = () => download(new Blob([ed.value]), f.path);
  $('#fnd').onclick = () => { $('#fbar').hidden = !$('#fbar').hidden; $('#fi').focus(); };
  $('#fi').oninput = () => { const q = $('#fi').value; $('#fc').textContent = q ? (ed.value.split(q).length - 1) + ' Treffer' : ''; };
  $('#fa').onclick = () => { const q = $('#fi').value; if (!q) return; ed.value = ed.value.split(q).join($('#ri').value); gutter(); mark(); $('#fi').oninput(); };
  if (isHtml) $('#prev').onclick = () => {
    const col = $('.edcol'), old = $('#pv');
    if (old){ old.replaceWith(col); $('#prev').textContent = 'Vorschau'; return; }
    const fr = document.createElement('iframe'); fr.id = 'pv'; fr.srcdoc = ed.value; fr.sandbox = 'allow-scripts';
    col.replaceWith(fr); $('#prev').textContent = 'Editor';
  };
  if (tab === 'ai') bindAi();
}
async function save(){
  const ed = $('#ed'); if (!ed || !cur || !canWrite()) return;
  try {
    const sha = await writeFile(cur.path, ed.value, cur.sha);
    if (sha) cur.sha = sha;
    cur.text = ed.value; mark(); toast(savedMsg(), 'ok');
  } catch(err){ toast('Speichern fehlgeschlagen: ' + err.message, 'err'); }
}
async function remove(f){
  if (!canWrite()) return;
  if (f.path === 'index.html'){ toast('index.html kann nicht gelöscht werden.', 'err'); return; }
  if (!confirm(f.path + ' wirklich löschen?')) return;
  try { await removeFile(f); cur = null; $('#main').innerHTML = '<div class="empty">Gelöscht.</div>'; load(); }
  catch(err){ toast('Löschen fehlgeschlagen: ' + err.message, 'err'); }
}

/* ---------- KI-Assistent: Übersetzer ersetzt Zeilen im offenen Editor ---------- */
let pending = null, undoText = null;
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function aiRange(){
  const n = $('#ed').value.split('\n').length;
  let a = +$('#a1').value || 1, b = +$('#a2').value || n;
  a = Math.max(1, Math.min(a, n)); b = Math.max(a, Math.min(b, n)); return [a, b];
}
function aiPrompt(){
  const [a, b] = aiRange(), L = $('#ed').value.split('\n');
  const code = L.slice(a - 1, b).map((t, i) => (a + i) + '| ' + t).join('\n');
  return 'Du bearbeitest die Datei "' + cur.path + '". Die Zeilen sind nummeriert (Format "Nr| Code"). Antworte NUR mit JSON, ohne Erklärung, in diesem Format:\n' +
    '{"edits":[{"start":12,"end":14,"text":"neuer Code"}]}\n' +
    'start und end sind Zeilennummern des Originals (inklusive). "text" ersetzt diese Zeilen (ohne Zeilennummern). Leerer text löscht die Zeilen. end = start-1 fügt vor Zeile start ein. Ändere nur das Nötige.\n\n' +
    'Aufgabe: ' + $('#ap').value + '\n\nCode (Zeilen ' + a + '-' + b + '):\n' + code;
}
function translate(){
  const out = $('#aout'); out.textContent = ''; pending = null;
  const m = $('#ar').value.match(/\{[\s\S]*\}/);
  let list;
  try { list = JSON.parse(m[0]).edits; if (!Array.isArray(list) || !list.length) throw 0; }
  catch(e){ out.textContent = 'Antwort nicht lesbar. Erwartet wird JSON mit "edits".'; return; }
  const L = $('#ed').value.split('\n');
  list = list.map(e => ({ s: +e.start, e: +e.end, t: String(e.text == null ? '' : e.text) })).sort((a, b) => a.s - b.s);
  for (let i = 0; i < list.length; i++){
    const x = list[i];
    if (!(x.s >= 1 && x.e >= x.s - 1 && x.e <= L.length) || (i && x.s <= list[i - 1].e)){ out.textContent = 'Ungültiger Zeilenbereich in der Antwort (Zeile ' + x.s + '–' + x.e + ').'; return; }
  }
  pending = list;
  list.forEach(x => {
    const box = el('div', 'dif'); box.appendChild(el('b', '', x.e < x.s ? 'Einfügen vor Zeile ' + x.s : 'Zeilen ' + x.s + '–' + x.e));
    if (x.e >= x.s) box.appendChild(el('pre', 'o', L.slice(x.s - 1, x.e).slice(0, 8).join('\n')));
    if (x.t !== '') box.appendChild(el('pre', 'n', x.t.split('\n').slice(0, 8).join('\n')));
    out.appendChild(box);
  });
  const rg = el('div', 'rg'), ok = el('button', '', 'Anwenden'), no = el('button', 'ghost', 'Verwerfen');
  ok.onclick = applyEdits; no.onclick = () => { pending = null; out.textContent = ''; };
  rg.append(ok, no); out.appendChild(rg);
}
function applyEdits(){
  const ed = $('#ed'), out = $('#aout'); if (!pending) return;
  undoText = ed.value; const L = ed.value.split('\n');
  [...pending].sort((a, b) => b.s - a.s).forEach(x => L.splice(x.s - 1, x.e - x.s + 1, ...(x.t === '' ? [] : x.t.split('\n'))));
  ed.value = L.join('\n'); gutter(); mark(); pending = null;
  out.textContent = 'Angewendet. Noch nicht gespeichert. ';
  const u = el('button', 'ghost', 'Rückgängig'); u.onclick = () => { ed.value = undoText; gutter(); mark(); out.textContent = 'Rückgängig gemacht.'; };
  out.appendChild(u);
}
function bindAi(){
  const ed = $('#ed');
  $('#asel').onclick = () => {
    const v = ed.value;
    $('#a1').value = v.slice(0, ed.selectionStart).split('\n').length;
    $('#a2').value = v.slice(0, ed.selectionEnd).split('\n').length;
  };
  $('#acopy').onclick = async () => {
    if (!$('#ap').value.trim()){ toast('Bitte zuerst eine Aufgabe eingeben.', 'err'); return; }
    try { await navigator.clipboard.writeText(aiPrompt()); toast('Prompt kopiert. Einer KI geben und die Antwort unten einfügen.', 'ok'); }
    catch(e){ prompt('Prompt kopieren:', aiPrompt()); }
  };
  $('#akey').onclick = () => {
    const k = (prompt('Anthropic-API-Key (bleibt nur in diesem Browser; leer = entfernen)') || '').trim();
    if (k) localStorage.setItem('aikey', k); else localStorage.removeItem('aikey');
  };
  $('#atr').onclick = translate;
  $('#asend').onclick = async () => {
    const key = localStorage.getItem('aikey');
    if (!key){ toast('Erst „API-Key“ eintragen – oder „Prompt kopieren“ nutzen.', 'err'); return; }
    if (!$('#ap').value.trim()){ toast('Bitte eine Aufgabe eingeben.', 'err'); return; }
    $('#aout').textContent = 'KI arbeitet …';
    try {
      const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: 'claude-sonnet-5-5', max_tokens: 4000, messages: [{ role: 'user', content: aiPrompt() }] }) });
      const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
      $('#ar').value = j.content.map(c => c.text || '').join(''); translate();
    } catch(err){ $('#aout').textContent = ''; toast('KI-Fehler: ' + err.message, 'err'); }
  };
}
$('#newFile').onclick = async () => {
  if (!canWrite()) return;
  const name = (prompt('Dateiname, z. B. quellen.html') || '').trim();
  if (!name) return;
  if (tree.some(f => f.path === name)){ toast('Die Datei gibt es schon.', 'err'); return; }
  const starter = /\.html?$/i.test(name) ? '<!DOCTYPE html>\n<html lang="de">\n<head><meta charset="utf-8"><title>Neu</title></head>\n<body>\n\n</body>\n</html>\n' : '';
  try { await writeFile(name, starter); await load(); const f = tree.find(x => x.path === name); if (f) openFile(f); }
  catch(err){ toast('Anlegen fehlgeschlagen: ' + err.message, 'err'); }
};
$('#importBtn').onclick = () => $('#importIn').click();
$('#importIn').onchange = e => upload([...e.target.files]);

/* ---------- Hochladen & Videos ---------- */
function progress(label, f){
  $('#prog').hidden = false; $('#pn').textContent = label + (f == null ? ' – bereite vor …' : f >= 1 ? ' – wird gespeichert …' : ' – ' + Math.round(f * 100) + ' %');
  $('#pf').style.width = Math.round((f || 0) * 100) + '%';
}
async function upload(list){
  if (!canWrite()) return;
  for (let i = 0; i < list.length; i++){
    const file = list[i], tag = file.name + (list.length > 1 ? ' (' + (i + 1) + '/' + list.length + ')' : '');
    if (mode === 'gh' && file.size > 50 * 1024 * 1024){ toast(file.name + ' ist größer als 50 MB.', 'err'); continue; }
    progress(tag, null);
    try {
      const path = (VIDEO.test(file.name) ? 'videos/' : '') + file.name.replace(/\s+/g, '-');
      const old = tree.find(x => x.path === path);
      await writeFile(path, file, old && old.sha, f => progress(tag, f));
      toast(file.name + ': ' + savedMsg(), 'ok');
    } catch(err){ toast('Upload fehlgeschlagen: ' + err.message, 'err'); }
  }
  $('#prog').hidden = true;
  await load();
}
function showVideos(){
  $('#main').innerHTML =
    '<div class="head"><span class="name">Videos</span></div>' +
    '<div style="overflow:auto;padding:14px;flex:1"><div class="drop" id="drop">Videos hierher ziehen oder klicken</div>' +
    '<input type="file" id="pick" accept="video/*" multiple hidden><div id="vbox"></div></div>';
  const drop = $('#drop'), pick = $('#pick');
  drop.onclick = () => pick.click();
  pick.onchange = () => upload([...pick.files]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); upload([...e.dataTransfer.files]); };
}
async function playVideo(f){
  cur = f; renderSide(); showVideos();
  $('#vbox').innerHTML = '<div style="margin-bottom:8px;display:flex;gap:8px;align-items:center"><span class="name" style="flex:1;color:var(--brass)"></span><button class="ghost" id="vdl">Herunterladen</button><button class="danger" id="vdel">Löschen</button></div><video controls></video>';
  $('#vbox .name').textContent = f.path;
  $('#vdel').onclick = () => remove(f);
  let blob = null;
  $('#vdl').onclick = async () => {
    try { download(blob || await readFile(f), f.path); } catch(err){ toast('Download fehlgeschlagen: ' + err.message, 'err'); }
  };
  try {
    blob = await readFile(f);
    if (videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = URL.createObjectURL(blob); $('#vbox video').src = videoUrl;
  } catch(err){ toast('Video konnte nicht geladen werden: ' + err.message, 'err'); }
}

/* Beim Neuladen im Team-Bereich wieder öffnen (muss ganz am Ende stehen) */
if (location.hash === '#team') askPw();
